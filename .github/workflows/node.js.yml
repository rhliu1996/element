name: Build Element Theme

on:
  push:
    paths:
      - 'packages/theme-chalk/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 Linux x64 环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16  # node-sass 最佳兼容版本
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd packages/theme-chalk
          npm install

      - name: Build theme
        run: |
          cd packages/theme-chalk
          npx gulp build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: element-theme-lib
          path: packages/theme-chalk/lib/
